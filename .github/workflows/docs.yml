name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install documentation dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  build-playground:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup WASI toolchain and wasm tools
        uses: ./.github/actions/setup-wasm-toolchain
        with:
          wasi-version: "29"

      - name: Configure Capylang compiler
        run: cmake -S . -B build -G Ninja --toolchain cmake/wasm-wasip-clang.cmake

      - name: Build capylang.wasm
        run: cmake --build build --target capylang

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground-app/package-lock.json

      - name: Install playground dependencies
        working-directory: playground-app
        run: npm ci

      - name: Stage compiler wasm for Vite public/
        run: cp build/capylang.wasm playground-app/public/capylang.wasm

      - name: Build playground (GitHub Pages base)
        working-directory: playground-app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/playground/
        run: npm run build

      - name: Upload playground dist
        uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: playground-app/dist

  package-pages:
    needs: [build-docs, build-playground]
    runs-on: ubuntu-latest

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download docs site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Download playground dist
        uses: actions/download-artifact@v4
        with:
          name: playground-dist
          path: playground-dist

      - name: Nest playground under site/playground
        run: |
          mkdir -p site/playground
          cp -a playground-dist/. site/playground/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
